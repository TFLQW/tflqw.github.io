name: Update Google Scholar citation counts

on:
  schedule:
    # 08:00 and 18:00 in UTC+2 (06:00 and 16:00 UTC)
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh citation counts
        run: python .github/scripts/update_scholar_citations.py

      - name: Commit changes
        run: |
          PAGES="P_by_year.html P_by_type.html"
          if git diff --quiet -- $PAGES; then
            echo "Citation counts are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PAGES
          git commit -m "chore: update Google Scholar citation counts"
          git push
